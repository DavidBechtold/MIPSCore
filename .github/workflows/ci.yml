name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        run: nuget restore MIPSCore.sln

      - name: Install .NET Framework 4.5 reference assemblies
        run: nuget install Microsoft.NETFramework.ReferenceAssemblies.net45 -Version 1.0.3 -OutputDirectory packages -ExcludeVersion

      - name: Build solution (Release)
        run: msbuild MIPSCore.sln /p:Configuration=Release /p:Platform="Any CPU" /p:TargetFrameworkRootPath="${{ github.workspace }}/packages/Microsoft.NETFramework.ReferenceAssemblies.net45/build/.NETFramework/"

      - name: Run all tests
        shell: pwsh
        run: |
          $vstest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.PackageGroup.TestTools.Core `
            -find "**\vstest.console.exe" | Select-Object -First 1

          if (-not $vstest) {
            throw "vstest.console.exe wurde nicht gefunden."
          }

          & $vstest `
            "Tests\bin\Release\Tests.dll" `
            "SystemTest\bin\Release\SystemTest.dll"
