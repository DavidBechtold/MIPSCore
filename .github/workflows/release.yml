name: Release after merged PR

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  build-smoke-release:
    if: github.event.pull_request.merged == true
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        run: nuget restore MIPSCore.sln

      - name: Install .NET Framework 4.5 reference assemblies and build
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net45 -Version 1.0.3 -OutputDirectory packages -ExcludeVersion
          $frameworkPath = Join-Path $PWD "packages\Microsoft.NETFramework.ReferenceAssemblies.net45\build\.NETFramework\v4.5"
          msbuild MIPSCore.sln /p:Configuration=Release /p:Platform="Any CPU" "/p:FrameworkPathOverride=$frameworkPath\"

      - name: Prepare release package
        shell: pwsh
        run: |
          New-Item -Path release -ItemType Directory -Force | Out-Null
          Copy-Item -Path "MIPSCoreConsole/bin/Release/*" -Destination "release" -Recurse -Force
          Copy-Item -Path "SystemTest/Testcode/fibonacci.objdump" -Destination "release/fibonacci.objdump" -Force

      - name: Smoke test built release
        shell: pwsh
        run: |
          $stdoutPath = Join-Path $PWD "release/smoke.log"
          $stderrPath = Join-Path $PWD "release/smoke.err.log"
          $objdumpPath = Join-Path $PWD "release/fibonacci.objdump"
          $exePath = Join-Path $PWD "release/MIPSCoreConsole.exe"
          $timeoutSeconds = 30
          $pollIntervalMilliseconds = 500

          $process = Start-Process -FilePath $exePath `
            -ArgumentList "-p `"$objdumpPath`"" `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath `
            -WorkingDirectory (Join-Path $PWD "release") `
            -NoNewWindow `
            -PassThru

          $deadline = (Get-Date).AddSeconds($timeoutSeconds)
          $completed = $false

          while ((Get-Date) -lt $deadline) {
            if (Test-Path $stdoutPath -PathType Leaf) {
              if (Select-String -Path $stdoutPath -Pattern "Completed" -Quiet -ErrorAction SilentlyContinue) {
                $completed = $true
                break
              }
            }

            if ($process.HasExited) {
              break
            }

            Start-Sleep -Milliseconds $pollIntervalMilliseconds
          }

          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force
            $process.WaitForExit()
          }

          $stdout = if (Test-Path $stdoutPath -PathType Leaf) { Get-Content $stdoutPath -Raw } else { "" }
          $stderr = if (Test-Path $stderrPath -PathType Leaf) { Get-Content $stderrPath -Raw } else { "" }

          if (-not $completed -and $stdout -match "Completed") {
            $completed = $true
          }

          if (-not $completed) {
            if ($stdout) {
              Write-Host "=== Smoke stdout ==="
              Write-Host $stdout
            }
            if ($stderr) {
              Write-Host "=== Smoke stderr ==="
              Write-Host $stderr
            }

            $exitCode = if ($process.HasExited) { $process.ExitCode } else { "n/a" }
            throw "Smoke-Test fehlgeschlagen: 'Completed' innerhalb von $timeoutSeconds Sekunden nicht gefunden (ExitCode=$exitCode)."
          }

      - name: Archive release package
        shell: pwsh
        run: |
          Compress-Archive -Path "release/*" -DestinationPath "MIPSCore-release.zip" -Force

      - name: Create release metadata
        id: meta
        shell: pwsh
        run: |
          $tag = "pr-${{ github.event.pull_request.number }}-run-${{ github.run_number }}"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Release PR #${{ github.event.pull_request.number }}
          body: |
            Automatischer Release nach Merge von PR #${{ github.event.pull_request.number }}.
            Enthält den Build aus `Release` sowie den erfolgreichen Smoke-Test mit `fibonacci.objdump`.
          files: MIPSCore-release.zip
